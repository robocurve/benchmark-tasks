<text x="80" y="973" font-family="Arial,sans-serif" font-size="18" fill="#18232c">S1: wire 0.50, mean dia 4.50, 9 active/11 total, free 15, solid &lt;=5.60.</text>
<text x="80" y="1008" font-family="Arial,sans-serif" font-size="18" fill="#18232c">Pair finished rate 1.500 +/-0.075 N/mm. Calibrate with indicator + force gauge.</text>
<text x="80" y="1043" font-family="Arial,sans-serif" font-size="18" fill="#18232c">S2: finished 400 +/-40 N mm/rad. Torque points 40 /68 N mm at 0.10 /0.17 rad.</text>
<text x="80" y="1078" font-family="Arial,sans-serif" font-size="18" fill="#18232c">S3: installed 0.15 +/-0.03 N. Its friction/preload is part of latch calibration.</text>
<text x="80" y="1138" font-family="Arial,sans-serif" font-size="18" fill="#18232c">Inspect: return repeatability &lt;=0.10; skew &lt;=0.10; print bar 50.00 +/-0.10.</text>
<text x="80" y="1173" font-family="Arial,sans-serif" font-size="18" fill="#18232c">Record actual displacement/force loading AND unloading for each of 3 pads.</text>
<text x="80" y="1208" font-family="Arial,sans-serif" font-size="18" fill="#18232c">Record masses, free drag, rack backlash, latch release angles and locked movement.</text>
<text x="80" y="1259" font-family="Arial,sans-serif" font-size="19" fill="#ba3434">The score limit is 2.0 mm, not a measured paper-bowing force law.</text>
<text x="80" y="1293" font-family="Arial,sans-serif" font-size="18" fill="#ba3434">All calibration-record.csv results remain blank. No tests on physical hardware performed.</text>
