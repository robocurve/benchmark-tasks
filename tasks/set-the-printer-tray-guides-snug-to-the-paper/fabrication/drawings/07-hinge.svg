<text x="80" y="977" font-family="Arial,sans-serif" font-size="17" fill="#18232c">Axle dia 3 h6 x 53 (S-23..30), set screw M2 in negative ear at S-17.75. PET thrust washers 0.3.</text>
<text x="65" y="1027" font-family="Arial,sans-serif" font-size="17" fill="#18232c">Ears 6061-T6, foot S12..19.5 mirrored, Z30..32; two M2x4 CSK per foot at N-21/-17, S+-13.5.</text>
<text x="65" y="1075" font-family="Arial,sans-serif" font-size="17" fill="#18232c">S2 torsion spring (SPRINGS.md): body S20.5..24.5 on POM sleeve OD6/ID3.10, S20..25.</text>
<text x="65" y="1123" font-family="Arial,sans-serif" font-size="17" fill="#18232c">Wing top Z30 to coil bottom Z31.4: 1.4 clearance. Squeeze must wind the coil.</text>
<text x="65" y="1171" font-family="Arial,sans-serif" font-size="17" fill="#18232c">Crank fork pocket N-28..-22, S+-2; pin dia 2 x 9 at N-25, Z36; rod eye 2 thick.</text>
<text x="65" y="1219" font-family="Arial,sans-serif" font-size="17" fill="#18232c">Clearances at 0.17: lever root to foot 1.69; lever to upright at Z44: 0.60.</text>
<text x="65" y="1267" font-family="Arial,sans-serif" font-size="17" fill="#18232c">Inspect &gt;=0.30 lever/upright and &gt;=0.25 pad/cheek clearance through full travel.</text>
<text x="65" y="1315" font-family="Arial,sans-serif" font-size="17" fill="#18232c">Stop angles 0 +/-0.002 and 0.170 +/-0.002 rad; reject an oversized or worn slot.</text>
