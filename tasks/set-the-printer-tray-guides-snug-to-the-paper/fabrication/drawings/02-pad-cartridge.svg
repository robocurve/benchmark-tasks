<text x="725.0" y="1072.0" font-family="Arial,sans-serif" font-size="17" fill="#176b9a">15 spring at zero / 10 at delta=5</text>
<text x="80" y="1153" font-family="Arial,sans-serif" font-size="18" fill="#18232c">Blue: zero pad. Red: delta=5 pad. Fixed cheek front ends at N=-8.5 (0.5 clearance).</text>
<text x="80" y="1188" font-family="Arial,sans-serif" font-size="18" fill="#18232c">Two S1 springs/pad. Pins dia3 x20; rear tips N=-23 -&gt; -28; rear clearance to N=-30.</text>
<text x="80" y="1223" font-family="Arial,sans-serif" font-size="18" fill="#187251">Backplate and cheek blocks clamp as a sandwich. No solid plate inside pad travel.</text>
<text x="80" y="1258" font-family="Arial,sans-serif" font-size="18" fill="#18232c">Rear block depth 8 + plate 4 + front block 9.5 = 21.5; all within N=-30..-8.5.</text>
<text x="80" y="1292" font-family="Arial,sans-serif" font-size="17" fill="#18232c">Cheek blocks occupy first/last 8 of pad span. Secondary bores along N at clamp holes.</text>
<text x="80" y="1328" font-family="Arial,sans-serif" font-size="18" fill="#ba3434">Contact face flatness &lt;=0.15; running skew &lt;=0.10; calibrate actual spring pair.</text>
