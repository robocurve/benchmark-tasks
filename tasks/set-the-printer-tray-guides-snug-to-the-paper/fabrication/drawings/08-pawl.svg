<text x="635.0" y="535.0" font-family="Arial,sans-serif" font-size="15" fill="#187251">S3</text>
<text x="635.0" y="735.0" font-family="Arial,sans-serif" font-size="15" fill="#18232c">button dia 3x1, top D-1.45</text>
<text x="635.0" y="780.0" font-family="Arial,sans-serif" font-size="15" fill="#18232c">counterbore dia 3.2</text>
<text x="305.0" y="902.5" font-family="Arial,sans-serif" font-size="15" fill="#707980">fixed rack: crest/valley 0.25/0.25</text>
<text x="305.0" y="925.0" font-family="Arial,sans-serif" font-size="15" fill="#18232c">T-walls end at C+0.30 over the rack; S-walls (beside rack) reach C-1</text>
<text x="65" y="1007" font-family="Arial,sans-serif" font-size="17" fill="#18232c">Teeth 0.15 wide x 0.20 deep at pitch 0.50; body bottom C+0.05 gives 0.15 penetration.</text>
<text x="65" y="1051" font-family="Arial,sans-serif" font-size="17" fill="#18232c">Body 4 along T x 10 across S x 4 high (3 + lid 1). Guide bore 4.10 x 10.10, outer 8.10 x 16.00.</text>
<text x="65" y="1095" font-family="Arial,sans-serif" font-size="17" fill="#18232c">Pickup gap g = 6 sin(0.10) - 0.15 = 0.449: set 0.45 +/-0.02; lid underside D-1.</text>
<text x="65" y="1139" font-family="Arial,sans-serif" font-size="17" fill="#18232c">Last tooth withdraws at 0.10 rad; 0.05 tip clearance at 0.108 rad; lift 0.57 at 0.17 rad.</text>
<text x="65" y="1183" font-family="Arial,sans-serif" font-size="17" fill="#18232c">S3 seats: lid top D to cap underside D+4.2; OD 3.2, rate target 0.084 N/mm (SPRINGS.md).</text>
<text x="65" y="1227" font-family="Arial,sans-serif" font-size="17" fill="#18232c">Backup stop M2 at T-1, S3.5, tip D+1.2; normal lift does not touch it.</text>
<text x="65" y="1271" font-family="Arial,sans-serif" font-size="17" fill="#18232c">Off-phase release: pawl rests on crests, unseated, until a small slide brings it over a valley.</text>
<text x="65" y="1315" font-family="Arial,sans-serif" font-size="17" fill="#18232c">Width crest C=-16, rear C=-29. Guide moves with the carriage on its drop plate, not the floor.</text>
<text x="65" y="1359" font-family="Arial,sans-serif" font-size="17" fill="#18232c">Holding 10 N, release angle and free friction are acceptance targets, not measured.</text>
