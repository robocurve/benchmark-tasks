[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yam-open-snack-packet"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy"]

[project.entry-points."inspect_robots.embodiments"]
snack_yam = "snack_runtime:embodiment"

[tool.setuptools]
py-modules = ["snack_runtime", "snack_base"]

