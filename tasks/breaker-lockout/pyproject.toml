[project]
name = "clamp-lockout"
version = "0.1.0"
description = "Clamp-on breaker lockout task for yam-isaac-lab-arena's station (task file, props, mechanics, scripted demo)"
requires-python = ">=3.12,<3.13"
license = "MIT"
# Isaac Sim, Isaac Lab-Arena 0.3.1 and yam-arena come from the launchable; install with --no-deps.
dependencies = ["inspect-robots>=0.60", "yam-arena"]

[project.entry-points."inspect_robots.policies"]
clamp-lockout-demo = "clamp_lockout.policy:clamp_lockout_demo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clamp_lockout"]
