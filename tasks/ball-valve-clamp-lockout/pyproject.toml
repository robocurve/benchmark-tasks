[project]
name = "clamp-valve-sim"
version = "0.1.0"
description = "Ball-valve clamp-lockout task for yam-isaac-lab-arena's station (task file, props, mechanics, scripted demo)"
requires-python = ">=3.12,<3.13"
license = "MIT"
# Isaac Sim, Isaac Lab-Arena 0.3.1 and yam-arena come from the launchable; install with --no-deps.
dependencies = ["inspect-robots>=0.60", "yam-arena"]

[project.entry-points."inspect_robots.policies"]
valve-clamp-demo = "clamp_valve_sim.policy:valve_clamp_demo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clamp_valve_sim"]
