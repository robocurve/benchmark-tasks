<text x="430.00" y="162.00" text-anchor="start" font-size="20" fill="#172e3c">Comb geometry</text>
<text x="430.00" y="196.00" text-anchor="start" font-size="15" fill="#172e3c">Tooth centers  x383, y−65, z933.75 + 12n; n = 0 … 17.</text>
<text x="430.00" y="220.00" text-anchor="start" font-size="15" fill="#172e3c">Each tooth  6 × 18 × 3. Clear vertical slot  9.</text>
<text x="430.00" y="244.00" text-anchor="start" font-size="15" fill="#172e3c">Spine  x380 … 386, y−84 … −74, z921.75 … 1149.75.</text>
<text x="430.00" y="268.00" text-anchor="start" font-size="15" fill="#172e3c">2 × Ø3.2 through X, center y−79 at z927.75 / 1143.75.</text>
<text x="430.00" y="292.00" text-anchor="start" font-size="15" fill="#172e3c">Mount holes in the spine carry the comb on rear standoffs.</text>
<text x="430.00" y="316.00" text-anchor="start" font-size="15" fill="#172e3c">Flat tooth top faces carry load. Deburr edges ≤0.15.</text>
<text x="430.00" y="372.00" text-anchor="start" font-size="20" fill="#172e3c">Engagement in X (flat bearing faces)</text>
<text x="430.00" y="404.00" text-anchor="start" font-size="15" fill="#172e3c">Tooth spans x380 … 386. Tongue spans x380.5 … 387.5.</text>
<text x="430.00" y="428.00" text-anchor="start" font-size="15" fill="#172e3c">Full return gives 5.5 mm overlap, 15 mm wide; 7 × 15 × 3 tongue.</text>
<text x="430.00" y="452.00" text-anchor="start" font-size="15" fill="#172e3c">At +8 mm travel the tongue begins at x388.5, leaving 2.5 mm.</text>
<text x="430.00" y="476.00" text-anchor="start" font-size="15" fill="#172e3c">Seated pointer z = 891.75 + 12n; tongue underside = zero + 43.5.</text>
<text x="430.00" y="500.00" text-anchor="start" font-size="15" fill="#172e3c">For n=4/14 the settled zeros are 939.75 / 1059.75 mm.</text>
<text x="430.00" y="524.00" text-anchor="start" font-size="15" fill="#172e3c">The neighboring tooth is 12 mm away; height tolerance is ±10.</text>
