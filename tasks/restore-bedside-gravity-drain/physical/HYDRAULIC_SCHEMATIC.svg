<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="784" viewBox="0 0 1150 784">
<title>Task39 water trainer. Source, restriction, shutoff, two air breaks and weighing cup</title>
<desc>Functional elevation, not to scale. A sealed Mariotte source moves with the mannequin. Water passes through a calibrated restrictor and a carriage-mounted shutoff to an open outlet fixed above the zero pointer. A vented chute below the outlet conveys water by gravity to an independent scale.</desc>
