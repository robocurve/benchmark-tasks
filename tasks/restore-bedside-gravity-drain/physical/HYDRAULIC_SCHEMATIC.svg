<text x="60" y="493" class="b">Height and routing checks</text>
<text x="61" y="530" class="a">Effective source = ear +150. Net head = effective source − spill sill. Match by ruler and wet head survey.</text>
<text x="61" y="560" class="a">Center tank at (700, 385). Verify at least 10 mm liquid above vent tip at end of collection.</text>
<text x="61" y="590" class="a">First lip (372, 50, zero+100). Moving drain lip (411, 47, zero+65). Verify ≥25 mm to fixed catch at all heights.</text>
<text x="61" y="620" class="a">Fixed trough bed through (411,47,940) → (480,47,935) → (480,−209,922) → (420,−209,918).</text>
<text x="61" y="650" class="a">Support every trough leg off the weighing pan. Verify both air breaks remain visible at maximum flow.</text>
<text x="61" y="680" class="a">Keep restrictor and meter settings fixed. Each 15 s full-open target at heads +170 / +50 / −70 mm:</text>
<text x="61" y="710" class="a" font-weight="bold">25.5 / 7.5 / 0 mL modeled. Measure both consecutive receiver gains and supply losses on the built rig.</text>
