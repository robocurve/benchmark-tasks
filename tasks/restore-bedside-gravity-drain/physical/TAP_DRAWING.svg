<circle cx="228.00" cy="315.00" r="88.00" fill="#acccce" stroke="#365666" stroke-width="1.4"/>
<circle cx="228.00" cy="315.00" r="60.00" fill="#e5ddd1" stroke="#365666" stroke-width="1.4"/>
<line x1="61.00" y1="315.00" x2="139.00" y2="315.00" stroke="#377e98" stroke-width="12"/>
<line x1="317.00" y1="315.00" x2="397.00" y2="315.00" stroke="#377e98" stroke-width="12"/>
<line x1="228.00" y1="255.00" x2="228.00" y2="375.00" stroke="#faffff" stroke-width="15"/>
<line x1="188.00" y1="355.00" x2="267.00" y2="276.00" stroke="#faffff" stroke-width="4"/>
<line x1="146.00" y1="457.00" x2="310.00" y2="457.00" stroke="#b45421" stroke-width="1.4" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="228.00" y="450.00" text-anchor="middle" font-size="15" fill="#974314">liner OD 12</text>
<text x="73.00" y="500.00" text-anchor="start" font-size="15" fill="#172e3c">Acetal plug OD 8.15, sleeve bore 8.0 nominal.</text>
<text x="73.00" y="544.00" text-anchor="start" font-size="15" fill="#172e3c">Diametral main Ø3.2 at 90°, pilot Ø0.50 at 45°.</text>
<text x="73.00" y="568.00" text-anchor="start" font-size="15" fill="#172e3c">Opposed shallow metering grooves connect both.</text>
<text x="73.00" y="592.00" text-anchor="start" font-size="15" fill="#172e3c">Angle defined relative to closed rotor.</text>
<text x="465.00" y="164.00" text-anchor="start" font-size="20" fill="#172e3c">Fabricate &amp; set</text>
<text x="465.00" y="195.00" text-anchor="start" font-size="15" fill="#172e3c">4 mm ID hose on nonmedical 5 mm OD tails; sleeve windows Ø3.0.</text>
<text x="465.00" y="219.00" text-anchor="start" font-size="15" fill="#172e3c">Keyed cam and 2 mm follower dowel rotate with the rotor.</text>
<text x="465.00" y="243.00" text-anchor="start" font-size="15" fill="#172e3c">90° stop slot limits travel; shim end contact to ±0.5°.</text>
<text x="465.00" y="267.00" text-anchor="start" font-size="15" fill="#172e3c">Axial spring-ball plunger follows the two-slope dry cam.</text>
<text x="465.00" y="291.00" text-anchor="start" font-size="15" fill="#172e3c">Adjust preload for stable released endpoints and measurable snap.</text>
<text x="465.00" y="315.00" text-anchor="start" font-size="15" fill="#172e3c">Use cartridge dimensions and fittings in MECHANICAL_BUILD.md.</text>
<text x="465.00" y="370.00" text-anchor="start" font-size="20" fill="#172e3c">Verify on the assembled water circuit</text>
<text x="465.00" y="405.00" text-anchor="start" font-size="15" fill="#172e3c">Check at 0, 10, 45, 80 and 90° with fixed head/restriction.</text>
<text x="465.00" y="429.00" text-anchor="start" font-size="15" fill="#172e3c">Tune pilot in Ø0.05 increments for the measured middle band.</text>
<text x="465.00" y="453.00" text-anchor="start" font-size="15" fill="#172e3c">Only recorded wet sweeps establish cartridge performance.</text>
<text x="465.00" y="477.00" text-anchor="start" font-size="15" fill="#172e3c">Make a replacement blank if a hole is enlarged too far.</text>
<text x="465.00" y="501.00" text-anchor="start" font-size="15" fill="#172e3c">Do not fit clinical fittings or connect the fixture to a person.</text>
<line x1="35.00" y1="664.00" x2="965.00" y2="664.00" stroke="#86a5af" stroke-width="1.4"/>
<text x="35.00" y="692.00" text-anchor="start" font-size="14" fill="#172e3c">Task39   /   Water-only training fixture   /   Dimensions in mm   /   Do not scale from image</text>
</svg>
