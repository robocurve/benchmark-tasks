<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" font-family="DejaVu Sans, sans-serif" fill="#172e3c"><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45421"/></marker></defs><rect width="1000" height="720" fill="white"/>
<text x="35.00" y="56.00" text-anchor="start" font-size="32" fill="#172e3c">Quarter-turn tap</text>
<text x="35.00" y="93.00" text-anchor="start" font-size="17" fill="#172e3c">Dry actuator with a replaceable wet cartridge   •   ports in Y   •   shaft along X</text>
<line x1="35.00" y1="111.00" x2="965.00" y2="111.00" stroke="#86a5af" stroke-width="1.4"/>
<text x="52.00" y="156.00" text-anchor="start" font-size="19" fill="#172e3c">Ports at x368 with rotor closed</text>
