<text x="480.00" y="414.00" text-anchor="start" font-size="15" fill="#172e3c">The pocket is 1 mm wider on each side than a 20 mm truck.</text>
<text x="480.00" y="438.00" text-anchor="start" font-size="15" fill="#172e3c">The rail supports the truck; overhanging sides clear the bed.</text>
