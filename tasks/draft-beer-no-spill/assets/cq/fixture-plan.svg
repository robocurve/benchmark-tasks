<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" role="img" aria-labelledby="title desc">
  <title id="title">Wooden counter fixture: dimensioned fabrication plan</title>
  <desc id="desc">Original top and side views of the stand defined in geometry.py. A 150 by 330 by 25 millimetre board sits 265 millimetres above the bench, on four 35 by 35 by 225 millimetre posts and two 355 by 35 by 15 millimetre feet. Local coordinates, cut list and securing notes are included.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 8,4 0,0 0,8 Z" fill="#374151"/></marker>
    <marker id="axis-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0,0 8,4 0,8 Z" fill="#31556e"/></marker>
    <pattern id="wood" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#e5c7a7"/><path d="M 1,0 V 18 M 9,0 V 18" stroke="#d6b38d" stroke-width="0.6"/></pattern>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #182b3a; }
      .heading { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; fill: #475569; }
      .part { fill: url(#wood); stroke: #7b5738; stroke-width: 1.6; }
      .board { fill: #f2e5d4; fill-opacity: .92; stroke: #7b5738; stroke-width: 1.8; }
      .post { fill: #bc895c; stroke: #7b5738; stroke-width: 1.5; }
      .hidden { fill: none; stroke: #7b5738; stroke-width: 1; stroke-dasharray: 4 3; }
      .ext { fill: none; stroke: #9aa6af; stroke-width: .8; }
      .dim { fill: none; stroke: #374151; stroke-width: 1; marker-start: url(#arrow); marker-end: url(#arrow); }
      .dimtext { font-size: 13px; text-anchor: middle; paint-order: stroke; stroke: white; stroke-width: 5px; stroke-linejoin: round; }
      .axis { fill: none; stroke: #31556e; stroke-width: 1.4; marker-end: url(#axis-arrow); }
      .datum { fill: none; stroke: #7292a7; stroke-width: .8; stroke-dasharray: 5 4; }
      .rule { stroke: #d7e0e6; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1120" height="900" fill="white"/>
  <text x="40" y="43" font-size="25" font-weight="700">Wooden counter fixture</text>
  <text x="40" y="69" class="body">Original fabrication diagram from geometry.py · all dimensions in mm · not manufacturer CAD</text>
  <path d="M 40,83 H 1080" class="rule"/>

  <text x="55" y="112" class="heading">TOP VIEW</text>
  <text x="55" y="126" class="small">Looking down; posts shown through the board.</text>
  <!-- Top view: screen (205 + X, 320 - Y), at one drawing unit per mm. -->
  <rect x="95" y="162.5" width="355" height="35" class="part"/>
  <rect x="95" y="442.5" width="355" height="35" class="part"/>
  <rect x="280" y="155" width="150" height="330" class="board"/>
  <rect x="287.5" y="162.5" width="35" height="35" class="hidden"/>
  <rect x="392.5" y="162.5" width="35" height="35" class="hidden"/>
  <rect x="287.5" y="442.5" width="35" height="35" class="hidden"/>
  <rect x="392.5" y="442.5" width="35" height="35" class="hidden"/>
  <path d="M 299,180 H 311 M 305,174 V 186 M 404,180 H 416 M 410,174 V 186 M 299,460 H 311 M 305,454 V 466 M 404,460 H 416 M 410,454 V 466" stroke="#7b5738" stroke-width="1"/>
  <text x="151" y="185" class="body">Foot</text>
  <text x="151" y="465" class="body">Foot</text>
  <text x="355" y="308" class="body" text-anchor="middle">Top board</text>
  <text x="355" y="328" class="small" text-anchor="middle">centre (150, 0)</text>
  <path d="M 205,150 V 491 M 84,320 H 447" class="datum"/>
  <circle cx="205" cy="320" r="3" fill="#31556e"/>
  <path d="M 205,320 H 260 M 205,320 V 265" class="axis"/>
  <text x="262" y="313" class="body">+X</text>
  <text x="214" y="265" class="body">+Y</text>
  <text x="123" y="348" class="small">O: X = 0, Y = 0</text>
  <path d="M 95,161 V 143 M 450,161 V 143" class="ext"/>
  <path d="M 95,146 H 450" class="dim"/>
  <text x="272.5" y="140" class="dimtext">355 feet length</text>
  <path d="M 431,155 H 477 M 431,485 H 477" class="ext"/>
  <path d="M 467,155 V 485" class="dim"/>
  <text x="462" y="320" class="dimtext" transform="rotate(-90 462 320)">330 board width</text>
  <path d="M 451,162.5 H 513 M 451,477.5 H 513" class="ext"/>
  <path d="M 505,162.5 V 477.5" class="dim"/>
  <text x="500" y="320" class="dimtext" transform="rotate(-90 500 320)">315 feet support width</text>
  <path d="M 280,486 V 516 M 430,486 V 516" class="ext"/>
  <path d="M 280,508 H 430" class="dim"/>
  <text x="355" y="502" class="dimtext">150 board length</text>
  <text x="55" y="543" class="small">Feet support footprint: 355 × 315. Overall plan envelope: 355 × 330.</text>

  <text x="610" y="112" class="heading">SIDE VIEW</text>
  <text x="610" y="131" class="small">Looking along Y; front/rear feet and post pairs overlap.</text>
  <!-- Side view: screen (760 + X, 455 - H), where H = local Z + 265. -->
  <rect x="650" y="440" width="355" height="15" class="part"/>
  <rect x="842.5" y="215" width="35" height="225" class="post"/>
  <rect x="947.5" y="215" width="35" height="225" class="post"/>
  <rect x="835" y="190" width="150" height="25" class="board"/>
  <path d="M 612,455 H 1064" stroke="#182b3a" stroke-width="1.7"/>
  <text x="612" y="478" class="small">Bench surface: H = 0</text>
  <path d="M 760,170 V 454 M 736,190 H 996" class="datum"/>
  <circle cx="760" cy="190" r="3" fill="#31556e"/>
  <text x="616" y="171" class="small">O: mount datum</text>
  <text x="616" y="188" class="small">X = 0, local Z = 0</text>
  <path d="M 738,184 755,189" class="ext"/>
  <path d="M 688,374 H 739 M 688,374 V 323" class="axis"/>
  <text x="744" y="378" class="body">+X</text>
  <text x="696" y="324" class="body">+Z / +H</text>
  <text x="860" y="297" class="small" text-anchor="middle" transform="rotate(-90 860 297)">2 posts at X = 100</text>
  <text x="965" y="297" class="small" text-anchor="middle" transform="rotate(-90 965 297)">2 posts at X = 205</text>
  <path d="M 986,190 H 1036 M 1006,455 H 1036" class="ext"/>
  <path d="M 1026,190 V 455" class="dim"/>
  <text x="1020" y="322.5" class="dimtext" transform="rotate(-90 1020 322.5)">265 board top above bench</text>
  <path d="M 835,189 V 153 M 985,189 V 153" class="ext"/>
  <path d="M 835,160 H 985" class="dim"/>
  <text x="910" y="154" class="dimtext">150</text>
  <path d="M 834,190 H 806 M 841,215 H 806" class="ext"/>
  <path d="M 814,190 V 215" class="dim"/>
  <text x="797" y="207" class="dimtext">25</text>
  <path d="M 879,215 H 911 M 879,440 H 911" class="ext"/>
  <path d="M 902,215 V 440" class="dim"/>
  <text x="896" y="327.5" class="dimtext" transform="rotate(-90 896 327.5)">225 post length</text>
  <path d="M 649,440 H 621 M 649,455 H 621" class="ext"/>
  <path d="M 629,440 V 455" class="dim"/>
  <text x="610" y="451" class="dimtext">15</text>
  <text x="610" y="515" class="small">Engine omitted. Use its normal clamp on the 25 mm board.</text>
  <text x="610" y="534" class="small">No estimated engine internals are presented as measured parts.</text>

  <path d="M 40,565 H 1080" class="rule"/>
  <text x="40" y="595" class="heading">CUT LIST AND EXACT LOCAL PLACEMENT</text>
  <text x="40" y="619" class="small">Wood components; dimensions X × Y × Z. Centres use the product-local frame in geometry.py.</text>
  <rect x="40" y="633" width="1040" height="32" fill="#edf3f6"/>
  <text x="55" y="654" class="body" font-weight="700">Part / quantity</text>
  <text x="298" y="654" class="body" font-weight="700">Cut size (mm)</text>
  <text x="561" y="654" class="body" font-weight="700">Centre coordinates (X, Y, Z), mm</text>
  <path d="M 40,665 H 1080 M 40,702 H 1080 M 40,739 H 1080 M 40,776 H 1080" class="rule"/>
  <text x="55" y="689" class="body">Top board · 1</text>
  <text x="298" y="689" class="body">150 × 330 × 25</text>
  <text x="561" y="689" class="body">(150, 0, −12.5)</text>
  <text x="55" y="726" class="body">Posts · 4</text>
  <text x="298" y="726" class="body">35 × 35 × 225</text>
  <text x="561" y="726" class="body">(100 or 205, +140 or −140, −137.5); all four combinations</text>
  <text x="55" y="763" class="body">Feet · 2</text>
  <text x="298" y="763" class="body">355 × 35 × 15</text>
  <text x="561" y="763" class="body">(67.5, +140 or −140, −257.5)</text>
  <text x="40" y="800" class="body">Height above bench H = local Z + 265. Board top is local Z = 0; posts run H = 15 to 240.</text>
  <text x="40" y="825" class="body">Join the wood securely with ordinary screws/appropriate woodworking joints. Secure feet to the bench</text>
  <text x="40" y="846" class="body">with ordinary clamps or screws before a trial; verify stability under the actual engine's operating load.</text>
  <text x="40" y="875" class="small">This fixed support holds the apparatus, not the robot. Add no robot grasp aids, hidden attachments or altered pump mechanics.</text>
</svg>
