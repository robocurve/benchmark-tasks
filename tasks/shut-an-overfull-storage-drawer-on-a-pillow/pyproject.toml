[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "yam-overfull-drawer"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["inspect-robots==1.0.0", "inspect-robots-yam==0.38.0", "yam-arena==0.1.0", "numpy>=1.26", "scipy>=1.11", "pillow>=10", "imageio[ffmpeg]"]

[project.entry-points."inspect_robots.embodiments"]
yam_overfull_drawer = "rdb_overfull_drawer.adapter:make_embodiment"

[project.entry-points."inspect_robots.policies"]
overfull_drawer_scripted = "rdb_overfull_drawer.adapter:make_scripted"

[project.entry-points."inspect_robots.scorers"]
overfull_drawer_score = "rdb_overfull_drawer.grading:make_scorer"

[tool.setuptools.packages.find]
include = ["rdb_overfull_drawer*"]

[tool.setuptools.package-data]
rdb_overfull_drawer = ["drawer.usda"]
