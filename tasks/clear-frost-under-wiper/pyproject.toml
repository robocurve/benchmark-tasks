[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "robocurve-clear-frost-under-wiper"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["inspect-robots==1.0.0", "inspect-robots-yam==0.38.0", "yam-arena @ git+https://github.com/kairosiann/yam-isaac-lab-arena.git@0059d02a1a91bc6834c1d0846022891df0c78730"]
[project.entry-points."inspect_robots.embodiments"]
windshield_frost = "windshield_frost.environment:embodiment"
[project.entry-points."inspect_robots.policies"]
windshield_frost_scripted = "windshield_frost.controller:policy"
[tool.setuptools.packages.find]
include = ["windshield_frost*"]
