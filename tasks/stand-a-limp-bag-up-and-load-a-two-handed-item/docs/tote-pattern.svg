<svg xmlns="http://www.w3.org/2000/svg" width="1020mm" height="612mm" viewBox="0 0 1020 612">
  <title>Tote cutting pattern and handle assembly</title>
  <desc>Full-size millimetre drawing. The left cross is one fabric cutting template. The right column includes the board template, handle assembly and a section through the stop.</desc>
  <rect width="1020" height="612" fill="white"/>
  <text font-family="Arial, sans-serif" fill="#173a34" font-size="11px" font-weight="bold" x="24" y="17">Fold-flat grocery tote</text>
  <text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" x="24" y="29">Full size • All dimensions in mm • Print tiled at 100%, or transfer the dimensions with a ruler.</text>
  <!-- The floor is [214,524] × [235,395]. Four 10 mm flanges belong to the ends. -->
  <path fill="#f6faf6" stroke="#193d36" stroke-width=".65" stroke-linejoin="round" d="M214 45 H524 V225 H704 V235 H714 V395 H704 V405 H524 V585 H214 V405 H34 V395 H24 V235 H34 V225 H214 Z"/>
  <path d="M214 225v10 M524 225v10 M214 395v10 M524 395v10" stroke="#193d36" stroke-width=".65"/>
  <path fill="none" stroke="#496b62" stroke-width=".65" stroke-dasharray="4 2" d="M214 235H524V395H214Z M214 55H524 M214 575H524 M34 235V395 M704 235V395
    M34 235H214 M34 395H214 M524 235H704 M524 395H704"/>
  <path fill="none" stroke="#146e88" stroke-width=".8" stroke-dasharray="7 2 1 2" d="M214 145H524 M214 485H524 M124 235V395 M614 235V395"/>
  <path fill="none" stroke="#86562e" stroke-width=".6" d="M302 51v8 M298 55h8 M436 51v8 M432 55h8 M302 571v8 M298 575h8 M436 571v8 M432 575h8"/>
  <g text-anchor="middle">
    <text font-family="Arial, sans-serif" fill="#173a34" font-size="7px" font-weight="bold" x="369" y="76">Long wall • fold inward</text>
    <text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" x="369" y="88">310 wide × 180 high</text>
    <text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" x="369" y="101">Root centres 88 and 222 from left edge</text>
    <text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" x="369" y="137">Light crease at 90</text>
    <text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" x="369" y="197">10 rim turnback included at each free edge</text>
    <text font-family="Arial, sans-serif" fill="#173a34" font-size="7px" font-weight="bold" x="369" y="307">Fabric floor</text>
    <text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" x="369" y="320">310 × 160 • leave joined to all four walls</text>
    <text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" x="369" y="343">One-piece shell • cut one in 80 g/m² non-woven PP</text>
    <text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" x="369" y="476">Light crease at 90</text>
    <text font-family="Arial, sans-serif" fill="#173a34" font-size="7px" font-weight="bold" x="369" y="529">Long wall • fold inward</text>
    <text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" x="369" y="542">310 wide × 180 high</text>
    <text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" x="369" y="555">Root centres 88 and 222 from left edge</text>
    <g transform="translate(77 315) rotate(-90)">
      <text font-family="Arial, sans-serif" fill="#173a34" font-size="7px" font-weight="bold">End wall • fold outward</text>
      <text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" y="12">160 wide × 180 high</text>
    </g>
    <g transform="translate(661 315) rotate(90)">
      <text font-family="Arial, sans-serif" fill="#173a34" font-size="7px" font-weight="bold">End wall • fold outward</text>
      <text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" y="12">160 wide × 180 high</text>
    </g>
    <text font-family="Arial, sans-serif" fill="#173a34" font-size="4.4px" x="125" y="232">10 corner flange</text>
    <text font-family="Arial, sans-serif" fill="#173a34" font-size="4.4px" x="613" y="232">10 corner flange</text>
    <text font-family="Arial, sans-serif" fill="#173a34" font-size="4.4px" x="125" y="402">10 corner flange</text>
    <text font-family="Arial, sans-serif" fill="#173a34" font-size="4.4px" x="613" y="402">10 corner flange</text>
  </g>
  <text font-family="Arial, sans-serif" fill="#173a34" font-size="7px" font-weight="bold" x="24" y="67">Cut and mark</text>
  <path fill="#f6faf6" stroke="#193d36" stroke-width=".65" stroke-linejoin="round" d="M24 81h28"/><text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" x="58" y="83">Cut edge or slit</text>
  <path fill="none" stroke="#496b62" stroke-width=".65" stroke-dasharray="4 2" d="M24 94h28"/><text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" x="58" y="96">Floor fold, hem or flange</text>
  <path fill="none" stroke="#146e88" stroke-width=".8" stroke-dasharray="7 2 1 2" d="M24 107h28"/><text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" x="58" y="109">Wall crease</text>
  <path fill="none" stroke="#86562e" stroke-width=".6" d="M34 120h8 M38 116v8"/><text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" x="58" y="122">Handle root centre on rim</text>
  <text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" x="24" y="144">At each floor corner, snip the 10 mm</text>
  <text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" x="24" y="152">solid slit to free the end flange.</text>
  <text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" x="24" y="174">Overall blank 690 × 540.</text>
  <path d="M24 553v6 M24 556h100 M124 553v6" stroke="#193d36" stroke-width=".8"/>
  <text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" x="24" y="570">Print check • exactly 100 mm</text>

  <rect fill="#f6faf6" stroke="#193d36" stroke-width=".65" stroke-linejoin="round" x="692" y="45" width="310" height="160"/>
  <text font-family="Arial, sans-serif" fill="#173a34" font-size="7px" font-weight="bold" x="847" y="119" text-anchor="middle">Base insert • cut one</text>
  <text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" x="847" y="134" text-anchor="middle">310 × 160 × 2–3 corrugated polypropylene</text>

  <text font-family="Arial, sans-serif" fill="#173a34" font-size="7px" font-weight="bold" x="738" y="236">Handle • make two</text>
  <text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" x="738" y="247">Exterior view at full size. Cream webbing is 16 wide.</text>
  <!-- Outside loop width 150, rim y=360, far grip edge y=270. -->
  <rect fill="#fbf2d5" stroke="#705d38" stroke-width=".55" x="763" y="270" width="16" height="115"/>
  <rect fill="#fbf2d5" stroke="#705d38" stroke-width=".55" x="897" y="270" width="16" height="115"/>
  <rect fill="#fbf2d5" stroke="#705d38" stroke-width=".55" x="763" y="270" width="150" height="18" rx="2"/>
  <path fill="none" stroke="#52655f" stroke-width=".4" d="M763 262h150 M763 259v6 M913 259v6 M924 270v90 M921 270h6 M921 360h6"/>
  <text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" x="838" y="260" text-anchor="middle">150 outside</text>
  <text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" x="931" y="318">90 to rim</text>
  <text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" x="838" y="281" text-anchor="middle">Padded grip • 18 × 10</text>
  <path fill="none" stroke="#496b62" stroke-width=".65" stroke-dasharray="4 2" d="M738 360h180"/>
  <text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" x="792" y="356">Finished rim / hinge axis</text>
  <text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" x="786" y="378">25 sewn down each leg</text>

  <text font-family="Arial, sans-serif" fill="#173a34" font-size="7px" font-weight="bold" x="738" y="411">Root stop • side section at full size</text>
  <text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" x="738" y="422">One at each leg. Shown upright, with grip omitted.</text>
  <rect fill="#dcc297" stroke="#624e31" stroke-width=".45" x="770" y="432" width="4" height="86"/>
  <rect fill="#dcc297" stroke="#624e31" stroke-width=".45" x="770" y="518" width="4" height="25"/>
  <path d="M774.6 432v111" stroke="#ad7934" fill="none" stroke-width="1.2"/>
  <path d="M769 518v40" stroke="#496b62" fill="none" stroke-width="1"/>
  <path fill="none" stroke="#52655f" stroke-width=".4" d="M770 453h-13 M775 470h15 M770 518h-22 M774 534h16"/>
  <text font-family="Arial, sans-serif" fill="#173a34" font-size="4.4px" x="738" y="449">Inside</text>
  <text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" x="794" y="451">Moving strip • 86 × 12 × 4</text>
  <text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" x="794" y="472">Webbing hinge on exterior face</text>
  <text font-family="Arial, sans-serif" fill="#173a34" font-size="4.4px" x="738" y="514">Rim</text>
  <text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" x="794" y="519">Square ends meet here and block inward swing.</text>
  <text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" x="794" y="536">Fixed block • 25 × 12 × 4</text>
  <text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" x="738" y="573">Each loop uses two 115 × 16 webbing legs and one 148 × 14 × 2 crosspiece.</text>
  <text font-family="Arial, sans-serif" fill="#173a34" font-size="5px" x="738" y="582">Pad with a 148 × 16 × 8 foam blank and a 165 × 65 sleeve. Fit to 18 × 10.</text>
  <text font-family="Arial, sans-serif" font-size="5" fill="#173a34" x="738" y="591">Cut four 32 × 32 root pockets from shell scraps. Sew one over each fixed block.</text>
</svg>
