[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "yam-bag-load"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["inspect-robots==1.0.0", "inspect-robots-yam==0.38.0", "yam-arena==0.1.0", "numpy>=1.26", "pillow>=10", "imageio[ffmpeg]"]

[project.entry-points."inspect_robots.embodiments"]
yam_bag_load = "rdb_bag_load.adapter:make_embodiment"

[project.entry-points."inspect_robots.policies"]
bag_load_scripted = "rdb_bag_load.adapter:make_scripted"

[project.entry-points."inspect_robots.scorers"]
bag_load_score = "rdb_bag_load.grading:make_scorer"

[tool.setuptools.packages.find]
include = ["rdb_bag_load*"]

[tool.setuptools.package-data]
rdb_bag_load = ["bag.usda"]
