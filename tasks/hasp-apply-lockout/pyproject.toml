[project]
name = "haspapply-sim"
version = "0.1.0"
description = "Apply a group-lockout hasp to a disconnect handle and padlock it: task file for yam-isaac-lab-arena's station (props, mechanics, scripted demo)"
requires-python = ">=3.12,<3.13"
license = "MIT"
# Isaac Sim, Isaac Lab-Arena 0.3.1 and yam-arena come from the launchable; install with --no-deps.
dependencies = ["inspect-robots>=0.60", "yam-arena"]

[project.entry-points."inspect_robots.policies"]
hasp-apply-demo = "haspapply_sim.policy:hasp_apply_demo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["haspapply_sim"]
