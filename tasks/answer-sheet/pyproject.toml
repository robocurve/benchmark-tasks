[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "robocurve-answer-sheet"
version = "0.1.0"

[project.entry-points."inspect_robots.embodiments"]
yam_answer_sheet = "answer_sheet.embodiment:make_embodiment"

[project.entry-points."inspect_robots.policies"]
answer_sheet_scripted = "answer_sheet.policy:make_policy"

[tool.setuptools.packages.find]
include = ["answer_sheet*"]
