[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
[project]
name = "robocurve-confined-ratchet"
version = "0.1.0"
[project.entry-points."inspect_robots.embodiments"]
yam_confined_ratchet = "ratchet_task.embodiment:make_embodiment"
[project.entry-points."inspect_robots.policies"]
confined_ratchet_scripted = "ratchet_task.policy:make_fasten_policy"
[tool.setuptools.packages.find]
include = ["ratchet_task*"]
