[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yam-articulated-evals"
version = "0.1.0"
requires-python = ">=3.12"
authors = [{name = "MJAK Labs - Akhilesh Chandra"}]
dependencies = ["numpy"]

[project.entry-points."inspect_robots.embodiments"]
yam_articulated = "yam_articulated:embodiment"

[project.entry-points."inspect_robots.policies"]
yam_feedback = "yam_feedback:policy"

[tool.setuptools]
py-modules = ["yam_articulated", "yam_articulated_base", "yam_feedback"]
