<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
<rect width="210" height="297" fill="white"/>
<text x="15" y="20" font-size="6" font-family="Helvetica, Arial, sans-serif">Fan template for the hand of cards (print at 100%, A4)</text>
<text x="15" y="30" font-size="3.4" font-family="Helvetica, Arial, sans-serif">Lay the cards face up on their outlines: the 5 (back) first, the ace (red outline) last, on top.</text>
<text x="15" y="35" font-size="3.4" font-family="Helvetica, Arial, sans-serif">Cards 63.5 x 88.9 mm, 20 degrees apart, turned about the blue cross, 8 mm in from each card's lower right corner.</text>
<text x="15" y="40" font-size="3.4" font-family="Helvetica, Arial, sans-serif">Then slide the open gripper over the cross from below, along the 6's length, until its pad tips are 19 mm past</text>
<text x="15" y="45" font-size="3.4" font-family="Helvetica, Arial, sans-serif">the cross, and close it. Check the print: the scale bar must measure 50 mm.</text>
<line x1="15" y1="56" x2="65" y2="56" stroke="black" stroke-width="0.6"/>
<line x1="15" y1="54" x2="15" y2="58" stroke="black" stroke-width="0.4"/>
<line x1="65" y1="54" x2="65" y2="58" stroke="black" stroke-width="0.4"/>
<text x="40" y="63" font-size="3.4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">50 mm</text>
<polygon points="97.63,277.80 146.27,236.99 89.13,168.88 40.48,209.70" fill="none" stroke="#c00" stroke-width="0.6"/>
<text x="53.0" y="212.2" font-size="6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">A</text>
<polygon points="85.58,262.50 145.25,240.78 114.85,157.24 55.18,178.96" fill="none" stroke="black" stroke-width="0.35"/>
<text x="66.1" y="185.6" font-size="6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">2</text>
<polygon points="79.50,244.00 143.00,244.00 143.00,155.10 79.50,155.10" fill="none" stroke="black" stroke-width="0.35"/>
<text x="87.5" y="165.1" font-size="6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">6</text>
<polygon points="80.11,224.54 139.78,246.25 170.19,162.72 110.52,141.00" fill="none" stroke="black" stroke-width="0.35"/>
<text x="114.6" y="153.1" font-size="6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">4</text>
<polygon points="87.34,206.45 135.99,247.27 193.13,179.17 144.49,138.35" fill="none" stroke="black" stroke-width="0.35"/>
<text x="144.2" y="151.2" font-size="6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">5</text>
<line x1="131.0" y1="236.0" x2="139.0" y2="236.0" stroke="#06c" stroke-width="0.5"/>
<line x1="135.0" y1="232.0" x2="135.0" y2="240.0" stroke="#06c" stroke-width="0.5"/>
</svg>
