<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" font-family="sans-serif" font-size="12">
<rect width="760" height="900" fill="white"/>
<text x="20" y="24" font-size="15">Shop-built 12 in guillotine trimmer, top view, arm lowered and latched (mm, scale 1:1.5 of screen px)</text>
<text x="20" y="42">X back from the board front edge (down the page); Y right from the hinge-side edge (across the page).</text>
<rect x="60.0" y="60.0" width="495.0" height="742.5" fill="#e8d3a8" stroke="black"/><text x="559.0" y="495.25">board 495 x 330 x 20 plywood</text>
<rect x="52.5" y="52.5" width="30.0" height="60.0" fill="#a0825a" stroke="black"/>
<rect x="90.0" y="63.45" width="495.0" height="38.099999999999994" fill="#9aa3ad" stroke="black"/><text x="589.0" y="66.5">blade arm 330 x 25.4 x 4.8 (1 x 3/16 in bar)</text>
<rect x="483.0" y="61.5" width="54.0" height="42.0" fill="#555" stroke="black"/><text x="541.0" y="116.5">grip 28 dia x 36, 280 from hinge</text>
<rect x="205.5" y="107.55" width="39.0" height="51.0" fill="#999" stroke="black"/>
<rect x="210.0" y="80.55" width="30.0" height="45.00000000000001" fill="#d22" stroke="black"/><text x="244.0" y="147.05">latch 30 x 20 x 8, 16 mm travel</text>
<rect x="302.25" y="250.5" width="190.5" height="114.0" fill="#fff" stroke="black"/><text x="496.75" y="311.5">card stack 3 x 5 in (start)</text>
<text x="10" y="140" >hinge block</text><line x1="90.0" y1="40" x2="90.0" y2="120" stroke="blue" stroke-dasharray="4"/><text x="94.0" y="52" fill="blue">hinge axis Y 20, Z 2.4 (along X)</text>
<text x="20" y="830">Spring hinge: 3 in adjustable self-closing hinge, tension set to 4.7 N at the grip held flat, 2.8 N at 20 deg (0.028 N m/deg).</text>
<text x="20" y="846">Latch underside 3.5 mm over the lowered bar's top; felt pad gives 1.5 N sliding friction; 12 mm of slide = 10 mm over the bar.</text>
<text x="20" y="862">Top stop: wood block placed so the raised bar rests at 45 deg.</text>
</svg>