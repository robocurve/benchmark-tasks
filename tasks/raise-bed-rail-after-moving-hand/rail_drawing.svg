<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <rect width="1000" height="700" fill="#ffffff"/>
  <text x="20" y="24" font-size="16" font-weight="bold">Half side rail, release plunger and gas-spring assist: build drawing (all dimensions in mm)</text>

  <!-- ===== SIDE VIEW (looking along +y, robot on the left). 1 px = 1 mm. Origin: table top at the frame face ===== -->
  <text x="20" y="52" font-size="13" font-weight="bold">A. Side view at an arm pair (1 px = 1 mm). Table top = 0; frame face = 0</text>
  <g transform="translate(250,670)">
    <line x1="-230" y1="0" x2="300" y2="0" stroke="#000" stroke-width="2"/>
    <text x="-225" y="-4">table top</text>
    <rect x="0" y="-180" width="300" height="180" fill="#cfd3d8" stroke="#333"/>
    <text x="70" y="-90">bed frame + deck, top at 180</text>
    <rect x="0" y="-260" width="300" height="80" fill="#9fc3e6" stroke="#333"/>
    <text x="60" y="-216">foam mattress 80, top at 260</text>
    <!-- pivots inside the frame face: x +21, z 175 and 163 -->
    <circle cx="21" cy="-175" r="3" fill="#000"/>
    <circle cx="21" cy="-163" r="3" fill="#000"/>
    <!-- low: arm ends x -35, z 55 / 43 -->
    <line x1="21" y1="-175" x2="-35" y2="-55" stroke="#444" stroke-width="4"/>
    <line x1="21" y1="-163" x2="-35" y2="-43" stroke="#888" stroke-width="4"/>
    <!-- panel low: x -45..-25, z 14..174 -->
    <rect x="-45" y="-174" width="20" height="160" fill="#d9d9d9" stroke="#333"/>
    <!-- posts z 194..234, tube centre z 250 dia 32 -->
    <rect x="-39" y="-214" width="8" height="40" fill="#b8b8b8" stroke="#333"/>
    <circle cx="-35" cy="-230" r="16" fill="#a9a9a9" stroke="#333"/>
    <!-- top ghost: arms 65 deg above level, ends z 295 / 283; panel z 254..414; tube centre 470 -->
    <line x1="21" y1="-175" x2="-35" y2="-295" stroke="#999" stroke-width="3" stroke-dasharray="6,4"/>
    <line x1="21" y1="-163" x2="-35" y2="-283" stroke="#bbb" stroke-width="3" stroke-dasharray="6,4"/>
    <rect x="-45" y="-414" width="20" height="160" fill="none" stroke="#777" stroke-dasharray="6,4"/>
    <rect x="-39" y="-454" width="8" height="40" fill="none" stroke="#777" stroke-dasharray="6,4"/>
    <circle cx="-35" cy="-470" r="16" fill="none" stroke="#777" stroke-dasharray="6,4"/>
    <line x1="-20" y1="-486" x2="120" y2="-486" stroke="#c33" stroke-dasharray="3,3"/>
    <line x1="100" y1="-260" x2="100" y2="-486" stroke="#c33"/>
    <text x="106" y="-370" fill="#c33">226 (rail top over the</text>
    <text x="106" y="-356" fill="#c33">mattress; IEC 60601-2-52: 220 min)</text>
    <text x="-225" y="-500">tube 32 dia on 40 posts:</text>
    <text x="-225" y="-486">centre z 230 low, z 470 top</text>
    <text x="-225" y="-360">panel 20 x 160 x 700 (2.6 kg), inner</text>
    <text x="-225" y="-346">face 15 outside the mattress</text>
    <text x="-225" y="-332">edge; rail 232 overall</text>
    <text x="-225" y="-180">each pair: two flat bars 132</text>
    <text x="-225" y="-166">between holes, side by side</text>
    <text x="-225" y="-152">30 apart in y, hinged 12 apart</text>
    <text x="-225" y="-138">vertically at both ends</text>
    <text x="-225" y="-124">(a parallelogram: the panel</text>
    <text x="-225" y="-110">stays upright); pivots z 163</text>
    <text x="-225" y="-96">and 175; swing 130 deg,</text>
    <text x="-225" y="-82">rise 240</text>
  </g>

  <!-- ===== FRONT VIEW (looking along +x from the robot) ===== -->
  <text x="580" y="52" font-size="13" font-weight="bold">B. Front view, rail low (from the robot, 0.42 px = 1 mm)</text>
  <g transform="translate(660,250) scale(0.85)">
    <rect x="0" y="0" width="350" height="80" fill="#d9d9d9" stroke="#333"/>
    <text x="110" y="45">panel 700 x 160</text>
    <rect x="0" y="-36" width="350" height="16" fill="#a9a9a9" stroke="#333"/>
    <text x="110" y="-42">tube 32 x 700</text>
    <rect x="6" y="-20" width="8" height="20" fill="#b8b8b8" stroke="#333"/>
    <rect x="336" y="-20" width="8" height="20" fill="#b8b8b8" stroke="#333"/>
    <line x1="45" y1="60" x2="45" y2="130" stroke="#555" stroke-width="5"/>
    <line x1="305" y1="60" x2="305" y2="130" stroke="#555" stroke-width="5"/>
    <text x="10" y="148">foot-end pair (y +160)</text>
    <text x="215" y="148">head-end pair (y -360)</text>
    <text x="10" y="164">latch holes + plunger</text>
    <text x="215" y="164">gas spring, 91% of the weight</text>
    <text x="-95" y="236">gas spring (head-end pair): frame bracket to a pin on the lower arm</text>
    <text x="-95" y="252">40 from its pivot; 100 stroke, about 130 N (5.1 N m) with the arms level</text>
    <circle cx="-60" cy="40" r="7" fill="#d22" stroke="#333"/>
    <text x="-95" y="186">red knob, y +370,</text>
    <text x="-95" y="200">155 above the table</text>
    <line x1="-53" y1="40" x2="-2" y2="40" stroke="#333" stroke-width="2"/>
    <text x="-95" y="214">6 mm rod (inside the frame) 210 long</text>
    <text x="0" y="-62">panel spans y +250 (foot) to -450 (head)</text>
  </g>

  <!-- ===== INDEX PLATE detail ===== -->
  <text x="580" y="500" font-size="13" font-weight="bold">C. Foot-end lower arm pivot boss (1 px = 1 mm)</text>
  <g transform="translate(640,590)">
    <circle cx="0" cy="0" r="50" fill="#e5e5e5" stroke="#333"/>
    <circle cx="0" cy="0" r="5" fill="#000"/>
    <g fill="#fff" stroke="#333">
      <circle cx="-16.9" cy="36.3" r="4"/><circle cx="-16.9" cy="-36.3" r="4"/>
    </g>
    <text x="-48" y="62" font-size="10">low-stop hole</text>
    <text x="-48" y="-56" font-size="10">top-stop hole</text>
    <text x="58" y="-10" font-size="11">2 holes, 8 dia x 12 deep, on a 40 radius,</text>
    <text x="58" y="6" font-size="11">130 deg apart (low stop, top stop); M12 indexing</text>
    <text x="58" y="22" font-size="11">plunger pin (15 stroke) engages 10; free at 12 out;</text>
    <text x="58" y="38" font-size="11">between the stops the pin rides on the boss face</text>
  </g>
</svg>
