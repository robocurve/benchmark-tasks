[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
[project]
name = "robocurve-chip-sweep"
version = "0.1.0"
[project.entry-points."inspect_robots.embodiments"]
yam_chip_sweep = "chip_sweep.embodiment:make_embodiment"
[project.entry-points."inspect_robots.policies"]
chip_sweep_scripted = "chip_sweep.policy:make_policy"
[tool.setuptools.packages.find]
include = ["chip_sweep*"]
