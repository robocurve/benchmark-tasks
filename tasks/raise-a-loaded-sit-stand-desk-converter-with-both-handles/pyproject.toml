[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "yam-desk-converter"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["inspect-robots==1.0.0", "inspect-robots-yam==0.38.0", "yam-arena==0.1.0", "numpy>=1.26", "scipy>=1.11", "pillow>=10", "imageio[ffmpeg]"]

[project.entry-points."inspect_robots.embodiments"]
yam_desk_converter = "rdb_desk_converter.adapter:make_embodiment"

[project.entry-points."inspect_robots.policies"]
desk_converter_scripted = "rdb_desk_converter.adapter:make_scripted"

[project.entry-points."inspect_robots.scorers"]
desk_converter_score = "rdb_desk_converter.grading:make_scorer"

[tool.setuptools.packages.find]
include = ["rdb_desk_converter*"]

[tool.setuptools.package-data]
rdb_desk_converter = ["desk_converter.usda"]
