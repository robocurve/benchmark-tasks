[build-system]
requires=["setuptools>=64"]
build-backend="setuptools.build_meta"
[project]
name="yambition-measure-fit"
version="0.1.0"
requires-python=">=3.12"
dependencies=["numpy","scipy","yam-arena"]
[project.entry-points."inspect_robots.embodiments"]
yam_measure_fit="measure_fit.embodiment:MeasureFitEmbodiment"
[project.entry-points."inspect_robots.policies"]
measure_fit_scripted="measure_fit.policy:MeasureFitScriptedPolicy"
[tool.setuptools.packages.find]
include=["measure_fit*"]
