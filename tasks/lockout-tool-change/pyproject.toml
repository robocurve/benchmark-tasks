[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "robocurve-lockout-tool-change"
version = "0.0.1"

[project.entry-points."inspect_robots.embodiments"]
yam_lockout = "lockout_tool_change.embodiment:make_embodiment"

[tool.setuptools.packages.find]
include = ["lockout_tool_change*"]
