[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "yam-ukulele-tuning"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["inspect-robots==1.0.0", "inspect-robots-yam==0.38.0", "yam-arena==0.1.0", "numpy>=1.26", "scipy>=1.11", "pillow>=10", "imageio[ffmpeg]"]

[project.entry-points."inspect_robots.embodiments"]
yam_ukulele_tuning = "rdb_ukulele_tuning.adapter:make_embodiment"

[project.entry-points."inspect_robots.policies"]
ukulele_tuning_scripted = "rdb_ukulele_tuning.adapter:make_scripted"

[project.entry-points."inspect_robots.scorers"]
ukulele_tuning_score = "rdb_ukulele_tuning.grading:make_scorer"

[tool.setuptools.packages.find]
include = ["rdb_ukulele_tuning*"]

[tool.setuptools.package-data]
rdb_ukulele_tuning = ["ukulele.usda"]
