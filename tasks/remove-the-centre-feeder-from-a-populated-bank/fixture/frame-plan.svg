<text x="24" y="950">Rail section: genuine 20 x 20 V-slot; bottom 100, top 120 above bench.</text>
<text x="24" y="975">Slot blade: h 75..120; front y_m -28; genuine assembly includes its mating peg/PCB.</text>
<text x="24" y="1000">Closed shells follow all six exterior faces; cut-list.csv gives each panel.</text>
<text x="24" y="1025">Measure actual sheets. Bed: 3.0 +/-0.5 mm hardboard, top 143; shells 6.35 mm.</text>
<text x="24" y="1050">Two solid guides: 12 x 550 x 8. All positions +/-1 mm before enrollment.</text>
<text x="24" y="1075">Plan overlaps are intentional at joints; trim internal panels, never exterior faces.</text>
<text x="24" y="1100">See BUILD.md for joints, supports, cost, version limits and enrollment checks.</text>
