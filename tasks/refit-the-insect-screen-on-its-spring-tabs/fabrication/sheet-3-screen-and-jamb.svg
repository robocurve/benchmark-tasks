<text x="60.0" y="905.0" font-size="13" text-anchor="start" fill="#111111">Opening between the jambs: 412. Over the bolt tips the screen is 425 at rest and 402 with both tabs</text>
<text x="60.0" y="924.0" font-size="13" text-anchor="start" fill="#111111">squeezed, so it enters only while both tabs are held squeezed.</text>
<text x="60.0" y="943.0" font-size="13" text-anchor="start" fill="#111111">Frame pieces are cut square and joined by the kit's corner inserts (dark squares).</text>
<text x="60.0" y="962.0" font-size="13" text-anchor="start" fill="#111111">Drill each stile dia 6.0 through both walls, 45 above the screen's bottom edge, on the middle of the</text>
<text x="60.0" y="981.0" font-size="13" text-anchor="start" fill="#111111">frame's 11.1 thickness (5.55 from either face). Bolt tips stand 9.5 proud of each side at rest.</text>
<text x="60.0" y="1000.0" font-size="13" text-anchor="start" fill="#111111">Roll the mesh and spline into the groove on the back face last, after both latches are fitted and checked.</text>
