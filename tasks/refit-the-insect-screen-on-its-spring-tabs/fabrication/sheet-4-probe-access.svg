<text x="260.0" y="530.0" font-size="14" text-anchor="start" fill="#111111">Blade upper face follows intact port roof / channel ceiling</text>
<text x="1010.0" y="470.0" font-size="14" text-anchor="start" fill="#111111" font-weight="bold">Straight 0.10 feeler; &lt;=13 wide, &gt;=80 long.</text>
<text x="1010.0" y="496.0" font-size="14" text-anchor="start" fill="#111111">Align to apex; mark 45 / 55 probe witnesses.</text>
<text x="1010.0" y="522.0" font-size="14" text-anchor="start" fill="#111111">Empty passage + known 0.30 apex-gap controls</text>
<text x="1010.0" y="548.0" font-size="14" text-anchor="start" fill="#111111">must pass freely to far witness on BOTH sides.</text>
<text x="1010.0" y="574.0" font-size="14" text-anchor="start" fill="#111111">Refusal only at 45-55 deep = &lt;=0.10 local gap.</text>
<text x="1010.0" y="600.0" font-size="14" text-anchor="start" fill="#111111">Refusal before 45 deep = invalid access.</text>
<text x="1010.0" y="626.0" font-size="14" text-anchor="start" fill="#111111">Do not force; reject if frame moves &gt;1.</text>
<text x="1010.0" y="652.0" font-size="14" text-anchor="start" fill="#111111">Record blade uncertainty and close-up views.</text>
<text x="1010.0" y="678.0" font-size="14" text-anchor="start" fill="#111111">No bent tip or hidden 4.8-slot turn is needed.</text>
<text x="1010.0" y="704.0" font-size="14" text-anchor="start" fill="#111111">Actual assembly/access test still required.</text>
<text x="65.0" y="1040.0" font-size="17" text-anchor="start" fill="#111111" font-weight="bold">C. Hold landmarks: four visible front frame / mesh intersections</text>
<text x="65.0" y="1080.0" font-size="14" text-anchor="start" fill="#111111">Coordinates on front frame: y = +/-(203 - 19.05), z = 19.05 and 356 - 19.05; no spring markers required.</text>
<text x="65.0" y="1108.0" font-size="14" text-anchor="start" fill="#111111">Two fixed calibrated room-side oblique views reconstruct the rigid frame; transform its four back corners at 20 Hz.</text>
<text x="65.0" y="1136.0" font-size="14" text-anchor="start" fill="#111111">Each corner stays &lt;=1 mm Euclidean distance from its hold-start position for 1 s with hands &gt;5 mm clear.</text>
<text x="65.0" y="1164.0" font-size="14" text-anchor="start" fill="#111111">Validate known 1 mm translations in depth and across image, record uncertainty; physical validation remains pending.</text>
