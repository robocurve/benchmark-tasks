<text x="860.0" y="790.0" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">Window section</text>
<text x="860.0" y="809.0" font-size="13" text-anchor="start" fill="#111111">Window frame sides 412 apart (406 screen + 3 each side) at the channel depth; interior jambs</text>
<text x="860.0" y="828.0" font-size="13" text-anchor="start" fill="#111111">   (the reveal, 40 wide) 40 out from the screen's sides, from the room face back to the channels.</text>
<text x="860.0" y="847.0" font-size="13" text-anchor="start" fill="#111111">Stop 12 thick, lapping the screen by 10 on all four sides; glass 24 behind the stop's face.</text>
<text x="860.0" y="866.0" font-size="13" text-anchor="start" fill="#111111">Sill channel: floor level with the stool top, 70 above the table; lip 4 tall, 6 thick,</text>
<text x="860.0" y="885.0" font-size="13" text-anchor="start" fill="#111111">   its back face 12.6 in front of the stop.</text>
<text x="860.0" y="904.0" font-size="13" text-anchor="start" fill="#111111">Head: lip underside 350 above the floor (6 below the seated screen's top),</text>
<text x="860.0" y="923.0" font-size="13" text-anchor="start" fill="#111111">   its back face 15.9 in front of the stop (5/8 in channel); ceiling 362 above the floor.</text>
<text x="860.0" y="942.0" font-size="13" text-anchor="start" fill="#111111">Probe ports: 16 wide x 3 high at spring centers, top flush with ceiling; see sheet 4.</text>
<text x="860.0" y="961.0" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">Fitting check (before trials)</text>
<text x="860.0" y="980.0" font-size="13" text-anchor="start" fill="#111111">Seated, the screen's face is 45 behind the jambs' faces; 15.05 of the bottom rail shows</text>
<text x="860.0" y="999.0" font-size="13" text-anchor="start" fill="#111111">above the sill lip and 13.05 of the top rail below the head lip.</text>
<text x="860.0" y="1018.0" font-size="13" text-anchor="start" fill="#111111">Lifting the seated screen 4 or more (springs pressed 5; 6 presses them flat) lets</text>
<text x="860.0" y="1037.0" font-size="13" text-anchor="start" fill="#111111">   its bottom swing out over the lip.</text>
