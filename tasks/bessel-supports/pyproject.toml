[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "robocurve-bessel-supports"
version = "0.0.1"

[project.entry-points."inspect_robots.embodiments"]
yam_bessel = "bessel_supports.embodiment:make_embodiment"

[tool.setuptools.packages.find]
include = ["bessel_supports*"]
