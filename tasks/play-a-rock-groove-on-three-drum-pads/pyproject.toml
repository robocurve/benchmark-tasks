[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "yam-drum-groove"
version = "0.1.0"
description = "Two YAM arms play a slow rock-ballad groove on three electronic drum pads with a stick in each gripper"
requires-python = ">=3.12,<3.13"
dependencies = ["inspect-robots==1.0.0", "inspect-robots-yam==0.38.0", "yam-arena==0.1.0", "numpy>=1.26", "pillow>=10", "imageio[ffmpeg]", "matplotlib>=3.8"]

[project.entry-points."inspect_robots.embodiments"]
yam_drum_groove = "rdb_drum_groove.adapter:make_embodiment"

[project.entry-points."inspect_robots.policies"]
drum_groove_scripted = "rdb_drum_groove.adapter:make_scripted"

[project.entry-points."inspect_robots.scorers"]
drum_groove_score = "rdb_drum_groove.grading:make_scorer"

[tool.setuptools.packages.find]
include = ["rdb_drum_groove*"]

[tool.setuptools.package-data]
rdb_drum_groove = ["kit.usda"]
