<text x="10.000" y="15.000">Shelf-ready tray: tear line, 1:1. Outside faces of the left side wall, front wall and right side wall, unfolded about the front corners.</text>
<text x="10.000" y="22.000">Red: cut through the board. The gaps in it are the 15 ties (blue circles: 9 on the lip line, 3 down each diagonal). Ties: 0.60 mm on the diagonals, 1.20 mm on the lip line (starting widths: the batch pull test sets them). Black ticks: each tie's two edges.</text>
<text x="10.000" y="29.000">Grey: wall outlines, and the front-corner folds (dashed); do not cut. Front wall 310 x 115 mm, side walls 241 x 115 mm; lip line 40 mm above the bottom edge; each diagonal from 90 mm back from the front face at the top edge to the lip line 3 mm behind it.</text>
<text x="10.000" y="36.000">Print or cut at 100 %: the scale bar must measure 100 mm. By hand: tape each wall's printout on the wall and cut along the red line with a craft knife and a steel rule, stopping and restarting at the black ticks.</text>
<text x="130.500" y="165.000" text-anchor="middle">left side wall</text>
<text x="406.000" y="165.000" text-anchor="middle">front wall</text>
<text x="681.500" y="165.000" text-anchor="middle">right side wall</text>
