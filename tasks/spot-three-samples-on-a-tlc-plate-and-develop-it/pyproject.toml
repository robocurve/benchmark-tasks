[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "yam-tlc-spotting"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["inspect-robots==1.0.0", "inspect-robots-yam==0.38.0", "yam-arena==0.1.0", "numpy>=1.26", "scipy>=1.11", "pillow>=10", "imageio[ffmpeg]"]

[project.entry-points."inspect_robots.embodiments"]
yam_tlc_spotting = "rdb_tlc_spotting.adapter:make_embodiment"

[project.entry-points."inspect_robots.policies"]
tlc_spotting_scripted = "rdb_tlc_spotting.adapter:make_scripted"

[project.entry-points."inspect_robots.scorers"]
tlc_spotting_score = "rdb_tlc_spotting.grading:make_scorer"

[tool.setuptools.packages.find]
include = ["rdb_tlc_spotting*"]

[tool.setuptools.package-data]
rdb_tlc_spotting = ["tlc.usda"]
