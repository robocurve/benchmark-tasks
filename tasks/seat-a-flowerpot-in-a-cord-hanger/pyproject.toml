[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "yam-planter"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["inspect-robots==1.0.0", "inspect-robots-yam==0.38.0", "yam-arena==0.1.0", "numpy>=1.26", "scipy>=1.11", "pillow>=10", "imageio[ffmpeg]"]

[project.entry-points."inspect_robots.embodiments"]
yam_planter = "rdb_planter.arena:make_embodiment"

[project.entry-points."inspect_robots.policies"]
planter_reference = "rdb_planter.reference:make_scripted"

[project.entry-points."inspect_robots.scorers"]
planter_fit = "rdb_planter.grading:make_scorer"

[tool.setuptools.packages.find]
include = ["rdb_planter*"]

[tool.setuptools.package-data]
rdb_planter = ["station_prop.usda", "knot-grip.json"]
