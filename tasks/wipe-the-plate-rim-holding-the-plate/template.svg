<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="279mm" viewBox="0 0 210 279" font-family="Helvetica, Arial, sans-serif">
<title>Sauce template, 1:1: wipe the plate rim, holding the plate</title>
<rect x="0" y="0" width="210" height="279" fill="white"/>
<rect id="card" x="3" y="8" width="204" height="204" fill="none" stroke="black" stroke-width="0.4"/>
<line x1="101" y1="110" x2="109" y2="110" stroke="black" stroke-width="0.25"/>
<line x1="105" y1="106" x2="105" y2="114" stroke="black" stroke-width="0.25"/>
<text x="103" y="115" font-size="2.8" text-anchor="end">centre</text>
<circle id="hole-far-right" cx="164.043" cy="50.957" r="15" fill="none" stroke="black" stroke-width="0.4"/>
<line x1="162.043" y1="50.957" x2="166.043" y2="50.957" stroke="black" stroke-width="0.2"/>
<line x1="164.043" y1="48.957" x2="164.043" y2="52.957" stroke="black" stroke-width="0.2"/>
<line x1="105" y1="110" x2="164.043" y2="50.957" stroke="black" stroke-width="0.2" stroke-dasharray="1.5 1.5"/>
<text x="164.043" y="71.457" font-size="3.2" text-anchor="middle">far-right: cut out (30 mm)</text>
<text x="136.021" y="78.979" font-size="2.8" text-anchor="start">83.5 mm</text>
<circle id="hole-right" cx="188.5" cy="110" r="15" fill="none" stroke="black" stroke-width="0.4"/>
<line x1="186.5" y1="110" x2="190.5" y2="110" stroke="black" stroke-width="0.2"/>
<line x1="188.5" y1="108" x2="188.5" y2="112" stroke="black" stroke-width="0.2"/>
<line x1="105" y1="110" x2="188.5" y2="110" stroke="black" stroke-width="0.2" stroke-dasharray="1.5 1.5"/>
<text x="188.5" y="130.5" font-size="3.2" text-anchor="middle">right: cut out (30 mm)</text>
<text x="148.25" y="108.5" font-size="2.8" text-anchor="start">83.5 mm</text>
<circle id="hole-near" cx="105" cy="193.5" r="15" fill="none" stroke="black" stroke-width="0.4"/>
<line x1="103" y1="193.5" x2="107" y2="193.5" stroke="black" stroke-width="0.2"/>
<line x1="105" y1="191.5" x2="105" y2="195.5" stroke="black" stroke-width="0.2"/>
<line x1="105" y1="110" x2="105" y2="193.5" stroke="black" stroke-width="0.2" stroke-dasharray="1.5 1.5"/>
<text x="121.5" y="196" font-size="3.2" text-anchor="start">near: cut out (30 mm)</text>
<text x="106.5" y="150.25" font-size="2.8" text-anchor="start">83.5 mm</text>
<line x1="5" y1="13" x2="205" y2="13" stroke="black" stroke-width="0.2"/>
<text x="65" y="12" font-size="2.8" text-anchor="middle">card 204 mm</text>
<line x1="8" y1="10" x2="8" y2="210" stroke="black" stroke-width="0.2"/>
<text x="7" y="150" font-size="2.8" text-anchor="middle" transform="rotate(-90 7 150)">card 204 mm</text>
<line x1="33" y1="178" x2="33" y2="204" stroke="black" stroke-width="0.5"/>
<polygon points="30.5,201 35.5,201 33,207" fill="black"/>
<text x="37" y="190" font-size="3.6" text-anchor="start" font-weight="bold">this edge toward the robot</text>
<text x="37" y="195" font-size="3.2" text-anchor="start">(printed side up)</text>
<text x="201" y="24" font-size="3.2" text-anchor="end">the right arm's side →</text>
<text x="5" y="220" font-size="3.6" text-anchor="start" font-weight="bold">Sauce template, 1:1. Print at 100% (actual size) and check the 100 mm bar below.</text>
<text x="5" y="225.2" font-size="3.0" text-anchor="start">Card 204 x 204 mm, the plate's inside between the lip's inner faces. Cut along the outer square; cut out the three holes.</text>
<text x="5" y="230.4" font-size="3.0" text-anchor="start">Holes 30 mm across, centred 83.5 mm from the card centre. From the centre (x away from the robot, y to its left):</text>
<text x="5" y="235.6" font-size="3.0" text-anchor="start">   far-right (59.0, -59.0) mm, right (0.0, -83.5) mm, near (-83.5, 0.0) mm.</text>
<text x="5" y="240.8" font-size="3.0" text-anchor="start">If the printer clips the outer square, mark it 102 mm from the centre cross on each side.</text>
<line x1="5" y1="256" x2="105" y2="256" stroke="black" stroke-width="0.35"/>
<line x1="5" y1="256" x2="5" y2="252" stroke="black" stroke-width="0.25"/>
<line x1="15" y1="256" x2="15" y2="254" stroke="black" stroke-width="0.25"/>
<line x1="25" y1="256" x2="25" y2="254" stroke="black" stroke-width="0.25"/>
<line x1="35" y1="256" x2="35" y2="254" stroke="black" stroke-width="0.25"/>
<line x1="45" y1="256" x2="45" y2="254" stroke="black" stroke-width="0.25"/>
<line x1="55" y1="256" x2="55" y2="252" stroke="black" stroke-width="0.25"/>
<line x1="65" y1="256" x2="65" y2="254" stroke="black" stroke-width="0.25"/>
<line x1="75" y1="256" x2="75" y2="254" stroke="black" stroke-width="0.25"/>
<line x1="85" y1="256" x2="85" y2="254" stroke="black" stroke-width="0.25"/>
<line x1="95" y1="256" x2="95" y2="254" stroke="black" stroke-width="0.25"/>
<line x1="105" y1="256" x2="105" y2="252" stroke="black" stroke-width="0.25"/>
<text x="5" y="260.5" font-size="2.8" text-anchor="middle">0</text>
<text x="55" y="260.5" font-size="2.8" text-anchor="middle">50</text>
<text x="105" y="260.5" font-size="2.8" text-anchor="middle">100 mm</text>
</svg>
