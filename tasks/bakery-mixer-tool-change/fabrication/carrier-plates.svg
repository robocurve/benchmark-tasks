<svg xmlns="http://www.w3.org/2000/svg" width="300mm" height="420mm" viewBox="0 0 900 1260"><style>text{font-family:Arial,sans-serif;fill:#15283b;font-size:15px} .title{font-size:26px;font-weight:bold} .h{font-size:20px;font-weight:bold} .cut{fill:#eaf2f8;stroke:#203d58;stroke-width:1.5} .hole{fill:white;stroke:#203d58;stroke-width:1.3} .axis{stroke:#8b9bad;stroke-dasharray:5 4;fill:none} .line{stroke:#203d58;fill:none;stroke-width:1.2}</style><rect width="900" height="1260" fill="white"/><text x="45" y="45" class="title">Carrier plates and beater ballast</text><text x="45" y="76" class="">All dimensions mm. Plans at 1:1 when printed at 100%; confirm the 50 mm scale.</text><path d="M45,111 L195,111" class="line"/><path d="M45,105 L45,117" class="line"/><path d="M195,105 L195,117" class="line"/><text x="205" y="117" class="">50 mm</text><text x="130" y="163" class="h">UPPER CARRIER</text><text x="140" y="188" class="">D90 aluminium; thickness 6</text><circle cx="250" cy="345" r="135" class="cut"/><circle cx="250" cy="345" r="18.15" class="hole"/><circle cx="310" cy="345" r="39.0" class="hole"/><circle cx="250" cy="273" r="4.8" class="hole"/><circle cx="178" cy="345" r="4.8" class="hole"/><circle cx="250" cy="417" r="4.8" class="hole"/><path d="M100,345 L400,345" class="axis"/><path d="M250,195 L250,495" class="axis"/><text x="130" y="520" class="">Eccentric opening D26, centre (+20,0)</text><text x="130" y="545" class="">3 x D3.2: (0,+24), (-24,0), (0,-24)</text><path d="M250,307.5 L250,382.5" class="line"/><text x="95" y="578" class="">Centre bore D12.1; cross-drill D2 along y at plate mid-thickness.</text><text x="95" y="600" class="">Captive 2 x 25 steel pin locks the 70 mm shaft to this upper plate.</text><text x="95" y="622" class="">Retain eccentric bearing block with radial M3 set screw from +x edge.</text><text x="530" y="163" class="h">LOWER CARRIER</text><text x="540" y="188" class="">D90 aluminium; thickness 3</text><circle cx="650" cy="345" r="135" class="cut"/><circle cx="710" cy="345" r="57.0" class="hole"/><circle cx="650" cy="273" r="4.8" class="hole"/><circle cx="578" cy="345" r="4.8" class="hole"/><circle cx="650" cy="417" r="4.8" class="hole"/><path d="M500,345 L800,345" class="axis"/><path d="M650,195 L650,495" class="axis"/><text x="530" y="520" class="">Eccentric opening D38, centre (+20,0)</text><text x="530" y="545" class="">3 x D3.2: (0,+24), (-24,0), (0,-24)</text><text x="45" y="675" class="h">Permanent beater ballast — CUT FROM 6 mm MILD STEEL; DO NOT PRINT</text><text x="105" y="710" class="">2 x LARGE WEBS</text><rect x="140" y="740.0" width="60" height="240" class="cut"/><circle cx="155" cy="800" r="4.8" class="hole"/><circle cx="185" cy="800" r="4.8" class="hole"/><text x="110" y="1010" class="">20 x 80 x 6</text><text x="110" y="1034" class="">D3.2 through holes</text><text x="415" y="710" class="">1 x SHORT WEB</text><rect x="450" y="822.5" width="60" height="75" class="cut"/><circle cx="480" cy="882.5" r="4.8" class="hole"/><circle cx="480" cy="837.5" r="4.8" class="hole"/><text x="420" y="1010" class="">20 x 25 x 6</text><text x="420" y="1034" class="">D3.2 through holes</text><text x="610" y="745" class="">Hub-local installed centres:</text><text x="610" y="773" class="">large: (+8,+20,-125)</text><text x="610" y="797" class="">large: (-8,-20,-125)</text><text x="610" y="821" class="">short: (+8,0,-110)</text><text x="610" y="859" class="">Six M3 x 20 bolts, washers,</text><text x="610" y="883" class="">spacers and locking nuts.</text><text x="610" y="920" class="">Weigh complete tool:</text><text x="610" y="945" class="">250 +/-10 g.</text><text x="45" y="1090" class="">Plastic beater holes: y = +/-15, +/-25 at z = -105; y = 0 at z = -102.5, -117.5.</text><text x="45" y="1115" class="">Coordinates above use the unshifted hub origin; STL print translations are in mesh-validation.json.</text><text x="45" y="1140" class="">Round/deburr steel edges. Hardware is captive and outside the neck grasp. Inspect clearances before use.</text><text x="45" y="1200" class="">Construction drawing only. No fabricated-hardware performance or safety result is asserted.</text></svg>