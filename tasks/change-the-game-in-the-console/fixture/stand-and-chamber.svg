<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="960" height="640" fill="#ffffff"/>
  <text x="20" y="28" font-size="17" font-weight="bold">Stands, shelf board and console chamber (all sizes in mm; chamber figures are estimates)</text>

  <!-- Stand, side view at 1.5 px/mm, with a Game Pak lying on it -->
  <text x="20" y="60" font-weight="bold">Stand (two needed): solid pine block 80 deep x 100 wide x 60 high, flat top</text>
  <g transform="translate(110,90)">
    <rect x="0" y="0" width="200" height="30" fill="none" stroke="#2a4fd0" stroke-dasharray="6 4"/>
    <text x="8" y="20" fill="#2a4fd0">Game Pak, 133 long x 20 thick, label up</text>
    <rect x="75" y="30" width="120" height="90" fill="#c9a070" stroke="#000"/>
    <text x="100" y="80">stand, side</text>
    <line x1="0" y1="-10" x2="75" y2="-10" stroke="#2a4fd0"/><text x="8" y="-14" fill="#2a4fd0">50 overhang (label end)</text>
    <line x1="75" y1="135" x2="195" y2="135" stroke="#000"/><text x="125" y="152">80</text>
    <line x1="210" y1="30" x2="210" y2="120" stroke="#000"/><text x="216" y="80">60</text>
    <text x="0" y="175">Robot side is to the left. Stand centres: (295, +150) and (295, -150) from the arm-base midpoint.</text>
  </g>

  <!-- Shelf board -->
  <text x="520" y="60" font-weight="bold">Shelf board under the console: pine, 252 deep x 320 wide x 30 thick</text>
  <g transform="translate(560,90)">
    <rect x="0" y="0" width="252" height="40" fill="#c9a070" stroke="#000"/>
    <text x="60" y="25">board, side (front at left)</text>
    <text x="0" y="62">Its front edge is 8 behind the console's front face,</text>
    <text x="0" y="78">flush with the recessed black front strip.</text>
  </g>

  <!-- Chamber section at 2 px/mm -->
  <text x="20" y="300" font-weight="bold">Console chamber, side section on the centre line (front at left, heights above the shelf board)</text>
  <g transform="translate(60,330) scale(2)">
    <!-- lower body -->
    <rect x="8" y="49" width="195" height="40" fill="#444" stroke="#000"/>
    <text x="60" y="72" fill="#fff" font-size="6">lower body; chamber floor 40 up</text>
    <!-- roof behind lid and rear block -->
    <rect x="68" y="0" width="135" height="3" fill="#999" stroke="#000"/>
    <rect x="160" y="3" width="43" height="46" fill="#333"/>
    <!-- lid: top plate, front face, ledge -->
    <rect x="0" y="0" width="68" height="3" fill="#bbb" stroke="#000"/>
    <rect x="0" y="3" width="2.5" height="43.5" fill="#bbb" stroke="#000"/>
    <rect x="-8" y="43.5" width="8" height="3" fill="#bbb" stroke="#000"/>
    <circle cx="68" cy="1.5" r="1.5" fill="#c00"/>
    <text x="70" y="-3" font-size="6">lid hinge (68, 87.5 up); opens to 110 deg</text>
    <text x="-8" y="56" font-size="6">8 mm finger ledge</text>
    <!-- loaded pak -->
    <rect x="6" y="23" width="133" height="20" fill="none" stroke="#c0281c"/>
    <text x="30" y="36" font-size="6" fill="#c0281c">Game Pak 133 x 20; label end 6 behind the face</text>
    <!-- rails and connector -->
    <rect x="12" y="43" width="127" height="4" fill="#111"/>
    <rect x="139.5" y="27" width="13" height="16" fill="#111"/>
    <circle cx="149" cy="33" r="1.5" fill="#c00"/>
    <text x="100" y="20" font-size="6">72-pin connector stop at 139.5; carrier pivot (149, 56 up)</text>
    <text x="-8" y="100" font-size="6">Carrier pops up 0.10 rad about the pivot (label end about 14 higher); push-push catch toggles</text>
    <text x="-8" y="108" font-size="6">when the carrier is pressed 2.6 mm below down at the label end; over-travel ends 4.3 mm below down.</text>
  </g>
</svg>
