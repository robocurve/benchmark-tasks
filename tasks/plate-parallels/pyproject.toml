[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "robocurve-plate-parallels"
version = "0.0.1"

[project.entry-points."inspect_robots.embodiments"]
yam_parallels = "plate_parallels.embodiment:make_embodiment"

[tool.setuptools.packages.find]
include = ["plate_parallels*"]
