[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "robocurve-peel-hard-boiled-egg"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["inspect-robots==1.0.0", "inspect-robots-yam==0.38.0", "yam-arena @ git+https://github.com/kairosiann/yam-isaac-lab-arena.git@0059d02a1a91bc6834c1d0846022891df0c78730"]
[project.entry-points."inspect_robots.embodiments"]
peel_egg = "peel_egg.environment:embodiment"
[project.entry-points."inspect_robots.policies"]
peel_egg_scripted = "peel_egg.controller:policy"
[tool.setuptools.packages.find]
include = ["peel_egg*"]
