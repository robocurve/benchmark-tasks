<svg xmlns="http://www.w3.org/2000/svg" width="200mm" height="280mm" viewBox="0 0 200 280">
<rect width="200" height="280" fill="white"/>
<text x="10.00" y="12.00" font-size="5.0" font-family="Helvetica, Arial, sans-serif" text-anchor="start" fill="#000">Motor stand: full size (1:1), mm. PLA, 100 % or 40 % infill, 0.2 mm layers</text>
<text x="10.00" y="20.00" font-size="3.2" font-family="Helvetica, Arial, sans-serif" text-anchor="start" fill="#000">Holds a NEO V1.1 motor (60 mm across, 58.25 mm long) upright, shaft up, its back end 5 mm above the bench.</text>
<text x="10.00" y="24.60" font-size="3.2" font-family="Helvetica, Arial, sans-serif" text-anchor="start" fill="#000">Pocket 61 x 61 mm square, 25 mm deep (the simulation's pocket; a 60.5 mm round pocket also serves).</text>
<text x="10.00" y="29.20" font-size="3.2" font-family="Helvetica, Arial, sans-serif" text-anchor="start" fill="#000">A 12 mm wide cable slot in one wall, full depth, for the motor's leads. Two 5 mm holes for bench screws.</text>
<text x="10.00" y="33.80" font-size="3.2" font-family="Helvetica, Arial, sans-serif" text-anchor="start" fill="#000">Two M4 clamp screws (nylon-tipped thumb screws in heat-set inserts) through adjacent walls, 15 mm up, hold the motor.</text>
<text x="10.00" y="38.40" font-size="3.2" font-family="Helvetica, Arial, sans-serif" text-anchor="start" fill="#000">Its centre is the motor axis: 290 mm forward of the midpoint between the arm bases, on the centre line.</text>
<text x="30.00" y="58.00" font-size="4" font-family="Helvetica, Arial, sans-serif" text-anchor="start" fill="#000">PLAN</text>
