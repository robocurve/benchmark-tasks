<svg xmlns="http://www.w3.org/2000/svg" width="200mm" height="200mm" viewBox="0 0 200 200">
<rect width="200" height="200" fill="white"/>
<text x="10.00" y="12.00" font-size="5.0" font-family="Helvetica, Arial, sans-serif" text-anchor="start" fill="#000">Stack cradle: full size (1:1), mm. PLA or plywood with glued posts</text>
<text x="10.00" y="20.00" font-size="3.2" font-family="Helvetica, Arial, sans-serif" text-anchor="start" fill="#000">A 70 x 70 x 5 mm base with four 12 x 12 x 20 mm posts, centres 19 mm from the middle each way.</text>
<text x="10.00" y="24.60" font-size="3.2" font-family="Helvetica, Arial, sans-serif" text-anchor="start" fill="#000">The gearbox stack stands on the four post tops (25 mm above the bench), its spline and tabs in the gaps.</text>
<text x="10.00" y="29.20" font-size="3.2" font-family="Helvetica, Arial, sans-serif" text-anchor="start" fill="#000">Loose on the bench. Lot A: centre 200 mm forward, 140 mm to the robot's right, turned 30 deg counter-clockwise.</text>
<text x="10.00" y="33.80" font-size="3.2" font-family="Helvetica, Arial, sans-serif" text-anchor="start" fill="#000">Lot B: 205 mm forward, 140 mm to the robot's left, turned 30 deg clockwise (seen from above).</text>
