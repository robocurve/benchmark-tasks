[project]
name = "lockout-sim"
version = "0.1.0"
description = "Group-hasp lockout task for yam-isaac-lab-arena's station (task file, props, mechanics, demo replay)"
requires-python = ">=3.12,<3.13"
license = "MIT"
# Isaac Sim, Isaac Lab-Arena 0.3.1 and yam-arena come from the launchable; install with --no-deps.
dependencies = ["inspect-robots>=0.60", "yam-arena"]

[project.entry-points."inspect_robots.policies"]
lockout-demo = "lockout_sim.policy:lockout_demo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lockout_sim"]

