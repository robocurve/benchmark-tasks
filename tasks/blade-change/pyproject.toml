[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "blade-change"
version = "0.1.0"
description = "Replace and verify a blade in an unpowered quick-release holder with two YAM arms"
requires-python = ">=3.12"
dependencies = ["numpy", "yam-arena"]

[project.entry-points."inspect_robots.embodiments"]
yam_blade_change = "blade_change.embodiment:BladeEmbodiment"

[project.entry-points."inspect_robots.policies"]
blade_change_scripted = "blade_change.policy:BladeScriptedPolicy"

[tool.setuptools.packages.find]
include = ["blade_change*"]
