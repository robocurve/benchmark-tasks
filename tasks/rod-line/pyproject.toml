[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "robocurve-rod-line"
version = "0.0.1"

[project.entry-points."inspect_robots.embodiments"]
yam_rod = "rod_line.embodiment:make_embodiment"

[tool.setuptools.packages.find]
include = ["rod_line*"]
