[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "robocurve-assemble-blot-transfer-cassette"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["inspect-robots==1.0.0", "inspect-robots-yam==0.38.0", "yam-arena @ git+https://github.com/kairosiann/yam-isaac-lab-arena.git@0059d02a1a91bc6834c1d0846022891df0c78730"]
[project.entry-points."inspect_robots.embodiments"]
blot_cassette = "blot_cassette.environment:embodiment"
[project.entry-points."inspect_robots.policies"]
blot_cassette_scripted = "blot_cassette.controller:policy"
[tool.setuptools.packages.find]
include = ["blot_cassette*"]
