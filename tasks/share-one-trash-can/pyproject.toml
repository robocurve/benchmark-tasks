[project]
name = "share-one-trash-can"
version = "0.1.0"
description = "A YAM arm clears its desk into the one trash can it shares with a second, working YAM arm."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "mjlab==1.6.0",
  "torch==2.14.0",
  "pillow>=10",
  "mediapy>=1.2",
]

[project.optional-dependencies]
# Only for running Dream-1 on the task (dream_run.py).
dream = ["dreamlabs-client==1.0.0"]

[tool.uv]
package = false

# CUDA 13 torch, as pong's venv has it; the default PyPI wheel carries an older CUDA.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
